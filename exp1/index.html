<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
        <title>Experimento 1 - Produtos</title>
            <link rel="stylesheet" href="style.css">
            </head>
            <body>
                <div class="container">
                        <h1>Cadastro de Produtos</h1>
                                <form id="form-produto">
                                            <input type="text" id="nome" placeholder="Nome do produto">
                                                        <input type="number" id="preco" placeholder="Preço" step="0.01">
                                                                    <input type="number" id="estoque" placeholder="Quantidade em estoque">
                                                                                <button type="submit">Cadastrar</button>
                                                                                        </form>
                                                                                                
                                                                                                        <h2>Produtos Aprovados (Estoque > 0)</h2>
                                                                                                                <ul id="lista-aprovados"></ul>
                                                                                                                    </div>
                                                                                                                        <script src="script.js"></script>
                                                                                                                        </body>
                                                                                                                        </html>
